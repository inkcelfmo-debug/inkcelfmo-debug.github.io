  <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebPage","name":"挽商 · 圣杯空间","description":"请依次点击圣杯，直到圣杯注满。拖动转盘旋转，圣杯全满后可点选席位查看文字。","about":[{"@type":"CreativeWork","name":"第 1 席 自介","text":"挽商 21 天蝎座\nestp le–h switch"},{"@type":"CreativeWork","name":"第 2 席 风格","text":"温病 引导 剖析 逻辑\n近期多情绪病 温疯不定\n伪高 诱导 调侃 压迫 微擦 微文艺"},{"@type":"CreativeWork","name":"第 3 席 须知","text":"1.请提前告知备注、喜好风格、雷点，不接受未经告知的踩盲雷\n2.除现取外提前30分钟约好取单时间，鸽单迟到三次默认送单\n3.擅长循序渐进的引导，请不要以十分钟的展现定义我全部\n4.带旁观时，请站于远处不要出声/靠近\n5.自带人设/拼刺刀/互病/单口请提前告知\n6.婉拒无脑硬怼/恶意强压/摆烂不带入/人身攻击/污蔑辱骂等出戏情况\n7.我们有十分钟的磨合期,过程不适及时喊停\n8.请不要将单内截图以任何形式外传\n9.单后删好友是个人习惯，不会影响我们下次见面"},{"@type":"CreativeWork","name":"第 4 席 板评","text":"用淡蓝来形容你再合适不过。\n你给我这样的感觉。\n温柔 平淡像无波水面把人托举。\n可我垂下头。\n能看到深处翻涌着的波纹。\n——俞屿"},{"@type":"CreativeWork","name":"第 5 席 话术","text":"我有这样的心思不正是因为在意你，所以对你的言行逐字逐句推敲\n质疑后的肯定是因为我觉得你不应该只表露如此\n你我之间的关系应该是如胶似漆般的而不是见面都需要的问候疏离\n这样的肆意试探你爱意的方式让你琢磨不清吗\n那就来吻我吧，让我不再巧舌如簧\n不再说出让你心乱无底的言语"},{"@type":"CreativeWork","name":"第 6 席 头牌","text":""},{"@type":"CreativeWork","name":"第 7 席 卡类","text":""},{"@type":"CreativeWork","name":"第 8 席 寄语","text":"我们未曾磨灭的，是那颗不带功利性平淡相处又不知何处情绪起伏，要消磨着时间做的这些不紧要的事。\n一边感动着，一边漠视着。\n收获了一筐未命名的高兴，因为我触碰到了你，你回应了我。\n——仅此而已。"}]}</script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
    import { DEVOTEE_SLOTS as SHARED_SLOTS, MODEL_ASSETS as SHARED_MODEL_ASSETS } from './slots-data.mjs';

    /* ==========================================================
       0. 席位禅意数据配置 (1..8 严格对应，优先使用 SSR 注入)
       ========================================================== */
    const DEVOTEE_SLOTS = window.__WANSHANG_SSR__?.slots || SHARED_SLOTS;
    const MODEL_ASSETS = window.__WANSHANG_SSR__?.modelAssets || SHARED_MODEL_ASSETS;

    /* ==========================================================
       1. 原生 Web Audio 纯音频合成器
       ========================================================== */
    let audioCtx = null;
    let musicAnalyser = null;
    let musicFrequencyData = null;
    let musicAudioSource = null;
    let isMuted = false;
    const backgroundMusic = document.getElementById('background-music');
    backgroundMusic.volume = 0.2;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (!musicAnalyser) {
        musicAnalyser = audioCtx.createAnalyser();
        musicAnalyser.fftSize = 1024;
        musicAnalyser.smoothingTimeConstant = 0.68;
        musicFrequencyData = new Uint8Array(musicAnalyser.frequencyBinCount);
        musicAudioSource = audioCtx.createMediaElementSource(backgroundMusic);
        musicAudioSource.connect(musicAnalyser);
        musicAnalyser.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    function startBackgroundMusic() {
      if (isMuted) return;
      initAudio();
      if (!backgroundMusic.paused) return;
      backgroundMusic.play().catch((error) => {
        console.error('Background music playback failed:', error);
      });
    }

    function skipInteraction() {
      if (isFullyEnlightened || isDeepSpaceEntering || deepSpaceEntered) return;
      filledStatus.forEach((_, idx) => {
        filledStatus[idx] = true;
        waterLevels[idx] = fullWaterLevel;
        const water = devotees[idx].water;
        water.scale.y = waterLevels[idx] * waterHeightScales[idx];
        water.position.y = initialWaterLevel + waterLevels[idx] * 0.17 * waterHeightScales[idx];
        devotees[idx].waterMat.emissiveIntensity = 0.6 + waterLevels[idx] * 1.5;
      });
      activeSlotIndex = -1;
      checkEnlighten();
      updateUI();
    }
    document.addEventListener('pointerdown', (event) => {
      if (event.target.closest('#btn-audio')) return;
      startBackgroundMusic();
    });
    /* ==========================================================
       2. Three.js 核心场景构建
       ========================================================== */
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030308);
    scene.fog = new THREE.FogExp2(0x030308, 0.018);

    const isMobile = window.innerWidth < 800 || /Android|iPhone|iPad/i.test(navigator.userAgent);
    const camera = new THREE.PerspectiveCamera(isMobile ? 58 : 54, window.innerWidth / window.innerHeight, 0.1, 200);

    let defaultCamDist = window.innerWidth < 800 ? (isMobile ? 9.5 : 18.5) : 11.2;
    let defaultCamY = window.innerWidth < 800 ? (isMobile ? 4.4 : 5.8) : 4.2;
    const cameraLookTarget = new THREE.Vector3(0, 1.4, 0);
    function updateCameraBase() {
      const aspect = window.innerWidth / window.innerHeight;
      let dist = window.innerWidth < 800 ? (isMobile ? 9.5 : 18.5) : 11.2;
      let y = window.innerWidth < 800 ? (isMobile ? 4.4 : 5.8) : 4.2;
      if (aspect < 1) {
        const portraitScale = (1 / aspect) * 0.92;
        dist *= isMobile ? Math.pow(portraitScale, 0.35) : portraitScale;
        y += ((1 / aspect) - 1) * (isMobile ? 0.8 : 1.6);
      }
      defaultCamDist = dist; defaultCamY = y;
      camera.position.set(0, y, dist);
      cameraLookTarget.set(0, 1.4, 0);
      camera.lookAt(cameraLookTarget);
    }
    updateCameraBase();

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const loadingStatus = document.getElementById('loading-status');
    const openingScreen = document.getElementById('opening-screen');
    let allResourcesLoaded = false;
    let initialSceneReady = false;
    let pendingModelLoads = 0;
    function hideOpeningScreenWhenReady() {
      if (!allResourcesLoaded || pendingModelLoads > 0) return;
      if (initialSceneReady) return;
      initialSceneReady = true;
      loadingStatus.textContent = '加载完成';
      window.requestAnimationFrame(() => {
        openingScreen.classList.add('is-leaving');
        window.setTimeout(startInitialCupFill, isMobile ? 0 : 1400);
      });
    }
    const loadingManager = new THREE.LoadingManager();
    loadingManager.onProgress = (_url, loaded, total) => {
      loadingStatus.textContent = `正在加载场景… ${Math.round((loaded / total) * 100)}%`;
    };
    loadingManager.onLoad = () => {
      allResourcesLoaded = true;
      hideOpeningScreenWhenReady();
    };
    const ktx2Loader = new KTX2Loader()
      .setTranscoderPath('https://unpkg.com/three@0.147.0/examples/js/libs/basis/')
      .detectSupport(renderer);
    const gltfLoader = new GLTFLoader(loadingManager)
      .setKTX2Loader(ktx2Loader)
      .setMeshoptDecoder(MeshoptDecoder);
    const modelLoadPromises = new Map();
    async function loadModelWithRetry(url) {
      let firstError;
      try {
        return await gltfLoader.loadAsync(url);
      } catch (error) {
        firstError = error;
      }
      try {
        return await gltfLoader.loadAsync(url);
      } catch (error) {
        modelLoadPromises.delete(url);
        console.error(`Failed to load model ${url} after retry. Initial failure:`, firstError, 'Retry failure:', error);
        throw error;
      }
    }
    function loadGLTF(url, onLoad, onError) {
      pendingModelLoads++;
      let modelPromise = modelLoadPromises.get(url);
      if (!modelPromise) {
        modelPromise = loadModelWithRetry(url);
        modelLoadPromises.set(url, modelPromise);
      }
      modelPromise.then((gltf) => {
        try {
          onLoad(gltf);
        } finally {
          pendingModelLoads--;
          hideOpeningScreenWhenReady();
        }
      }, (error) => {
        try {
          if (onError) onError(error);
        } finally {
          pendingModelLoads--;
          hideOpeningScreenWhenReady();
        }
      });
    }
    const lineArtMaterial = new THREE.LineBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.95,
      depthWrite: false,
      toneMapped: false
    });
    const angelLineArtMaterial = lineArtMaterial.clone();
    const angelGlowLineArtMaterial = new THREE.LineBasicMaterial({
      color: 0xb9ddff,
      transparent: true,
      opacity: 0.18,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      toneMapped: false
    });
    const cupLineMaterials = Array.from({ length: 8 }, () => []);
    const lastCupLineProgress = new Array(8).fill(-1);
    const lineArtGeometryCache = new WeakMap();
    let angelModelRoot = null;

    function applyWhiteLineArt(root, thresholdAngle = 18, material = lineArtMaterial, style = 'white') {
      const outlineMaterials = [];
      root.traverse((object) => {
        if (!object.isMesh || object.userData.whiteLineArt || object.userData.skipWhiteLineArt) return;
        object.userData.whiteLineArt = true;

        const materials = Array.isArray(object.material) ? object.material : [object.material];
        if (materials.every((material) => material.opacity === 0)) return;
        materials.forEach((material) => {
          material.transparent = true;
          material.opacity = Math.min(material.opacity, 0.035);
          material.depthWrite = false;
        });

        let geometryCache = lineArtGeometryCache.get(object.geometry);
        if (!geometryCache) {
          geometryCache = new Map();
          lineArtGeometryCache.set(object.geometry, geometryCache);
        }
        const cacheKey = `${thresholdAngle}`;
        let edges = geometryCache.get(cacheKey);
        if (!edges) {
          edges = new THREE.EdgesGeometry(object.geometry, thresholdAngle);
          geometryCache.set(cacheKey, edges);
        }
        let outlineMaterial = material;
        if (style === 'cup') {
          outlineMaterial = material.clone();
          outlineMaterials.push(outlineMaterial);
        }
        if (style === 'angel') {
          const glow = new THREE.LineSegments(edges, angelGlowLineArtMaterial);
          glow.renderOrder = 1;
          object.add(glow);
        }
        const outline = new THREE.LineSegments(edges, outlineMaterial);
        outline.renderOrder = 2;
        object.add(outline);
      });
      return outlineMaterials;
    }

    function updateCupLineProgress(index, progress) {
      if (progress === lastCupLineProgress[index]) return;
      lastCupLineProgress[index] = progress;
      const color = new THREE.Color(0xffffff).lerp(new THREE.Color(0xffd84d), progress);
      cupLineMaterials[index].forEach((outlineMaterial) => outlineMaterial.color.copy(color));
    }

    /* ==========================================================
       3. 灯光与星穹粒子 (增强背景光源与阴影细节)
       ========================================================== */
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffecd0, 2.6);
    keyLight.position.set(6, 14, 8);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -10;
    keyLight.shadow.camera.right = 10;
    keyLight.shadow.camera.top = 10;
    keyLight.shadow.camera.bottom = -10;
    keyLight.shadow.bias = -0.0005;
    keyLight.shadow.normalBias = 0.02;
    keyLight.shadow.camera.updateProjectionMatrix();
    scene.add(keyLight);

    const haloLight = new THREE.PointLight(0xf5e2b0, 3.2, 18, 1.5);
    haloLight.position.set(-0.9, 7.2, -1.2);
    scene.add(haloLight);

    const bgLight = new THREE.PointLight(0x28558a, 2.0, 35, 1.8);
    bgLight.position.set(0, 3, -10);
    scene.add(bgLight);

    function createTwinklingStars(count, getPosition, sizeMin, sizeMax, color) {
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const sizes = new Float32Array(count);
      const phases = new Float32Array(count);
      const brightness = new Float32Array(count);
      for (let i = 0; i < count; i++) {
        const position = getPosition(i);
        positions.set(position, i * 3);
        sizes[i] = sizeMin + Math.random() * (sizeMax - sizeMin);
        phases[i] = Math.random() * Math.PI * 2;
        brightness[i] = 0.55 + Math.random() * 0.45;
      }
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
      geometry.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));
      geometry.setAttribute('aBrightness', new THREE.BufferAttribute(brightness, 1));

      const material = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uEnergy: { value: 0 },
          uColor: { value: new THREE.Color(color) }
        },

          attribute float aSize;
          attribute float aPhase;
          attribute float aBrightness;
          uniform float uTime;
          uniform float uEnergy;
          varying float vBrightness;
          void main() {
            float pulse = 0.58 + 0.42 * (0.5 + 0.5 * sin(uTime * (1.1 + aBrightness * 1.8) + aPhase));
            vBrightness = aBrightness * pulse * (1.0 + uEnergy * 0.45);
            gl_PointSize = aSize * (1.0 + uEnergy * 0.3);
            vec3 animatedPosition = position;
            float wavePhase = dot(position.xz, vec2(0.55, 0.35)) - uTime * 0.75;
            float wave = sin(wavePhase) * 0.75 + sin(wavePhase * 0.55 + 1.2) * 0.25;
            animatedPosition.y += wave * uEnergy * 0.28;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(animatedPosition, 1.0);
          }
        `,

          uniform vec3 uColor;
          varying float vBrightness;
          void main() {
            float distanceToCenter = distance(gl_PointCoord, vec2(0.5));
            float edgeFade = 1.0 - smoothstep(0.12, 0.5, distanceToCenter);
            gl_FragColor = vec4(uColor, edgeFade * vBrightness);
          }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        toneMapped: false
      });
      return new THREE.Points(geometry, material);

    function syncFreeViewFromCamera() {
      const offset = camera.position.clone().sub(cameraLookTarget);
      freeViewRadius = offset.length();
      freeViewTheta = Math.atan2(offset.x, offset.z);
      freeViewPhi = Math.acos(THREE.MathUtils.clamp(offset.y / freeViewRadius, -1, 1));
    }

    function updateFreeViewCamera() {
      const sinPhiRadius = Math.sin(freeViewPhi) * freeViewRadius;
      camera.position.set(
        cameraLookTarget.x + sinPhiRadius * Math.sin(freeViewTheta),
        cameraLookTarget.y + Math.cos(freeViewPhi) * freeViewRadius,
        cameraLookTarget.z + sinPhiRadius * Math.cos(freeViewTheta)
      );
      camera.lookAt(cameraLookTarget);
    }

    function setFreeViewActive(active, preserveView = false) {
      freeViewActive = active;
      autoTourActive = false;
      const button = document.getElementById('btn-auto-tour');
      button.classList.toggle('active', active);
      button.textContent = active ? '退出自由查看' : '自由查看';
      document.getElementById('free-view-hint').classList.toggle('show', active);
      if (active) {
        document.getElementById('deep-space-entry').classList.remove('show');
        document.getElementById('tear-cursor').style.display = 'none';
        syncFreeViewFromCamera();
      } else if (!preserveView) {

        document.getElementById('deep-space-entry').classList.add('show');
      }

    function calcTargetRotForSlot(slotIdx) {
      const baseAngle = (slotIdx / 8) * Math.PI * 2 - Math.PI / 2;
      return Math.PI / 2 - baseAngle;
    }

    function findClosestSlotIndex(curRotY) {
      let minDiff = Infinity;
      let closest = 0;
      for (let i = 0; i < 8; i++) {
        const base = (i / 8) * Math.PI * 2 - Math.PI / 2;
        let diff = ((base + curRotY - Math.PI / 2) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
        if (diff > Math.PI) diff = Math.PI * 2 - diff;
        if (diff < minDiff) { minDiff = diff; closest = i; }
      }
      return closest;
    }

    // 互动中只允许选择下一席；满杯后允许自由选择并吸附到正面。
    function setSlotActive(idx, doSnap = false) {
      if (!Number.isInteger(idx) || idx < 0 || idx >= DEVOTEE_SLOTS.length) return;
      if (!isFullyEnlightened && idx !== getNextCupIndex()) return;
      if (isFullyEnlightened) manualSlotSelection = true;
      activeSlotIndex = idx;
      updateUI();
      if (doSnap) {
        const target = calcTargetRotForSlot(idx);
        let diff = (target - ringGroup.rotation.y) % (Math.PI * 2);
        if (diff > Math.PI) diff -= Math.PI * 2;
        if (diff < -Math.PI) diff += Math.PI * 2;
        targetSnapRotY = ringGroup.rotation.y + diff;
        isSnapping = true;

        if (filledStatus[0]) {
          isInitialCupAutoFill = false;

      if (!isFullyEnlightened || isDeepSpaceEntering || deepSpaceEntered) return;
      completionPromptPending = false;
      setFreeViewActive(false, true);
      isReturningFromDeepSpace = false;
      autoTourActive = false;
      document.getElementById('btn-auto-tour').classList.remove('active');
      document.getElementById('btn-auto-tour').textContent = '自由查看';
      document.getElementById('ending').classList.remove('show');
      document.getElementById('angel-completion-text').classList.remove('show');
      document.getElementById('deep-space-entry').classList.remove('show');
      document.getElementById('tear-cursor').style.display = 'none';
      targetCamParallaxX = 0;
      targetCamParallaxY = 0;

      isDeepSpaceEntering = true;
      deepSpaceStartTime = performance.now();
      deepSpaceStartPosition.copy(camera.position);
      deepSpaceStartTarget.copy(cameraLookTarget);
      deepSpaceReturnPosition.copy(camera.position);
      deepSpaceReturnTarget.copy(cameraLookTarget);

      const angelBounds = angelModelRoot
        ? new THREE.Box3().setFromObject(angelModelRoot)
        : new THREE.Box3(new THREE.Vector3(-2, -1, -3), new THREE.Vector3(2, 8, 0));
      const angelSize = angelBounds.getSize(new THREE.Vector3());
      deepSpaceDestinationTarget.set(
        (angelBounds.min.x + angelBounds.max.x) / 2,
        angelBounds.min.y + angelSize.y * 0.72,
        (angelBounds.min.z + angelBounds.max.z) / 2
      );
      deepSpaceDestinationPosition.copy(deepSpaceDestinationTarget).add(
        new THREE.Vector3(0, Math.max(0.15, angelSize.y * 0.025), Math.max(3.8, angelSize.z * 1.25))
      );
    }

    function returnToPreviousLayer() {
      if (!deepSpaceEntered || isDeepSpaceEntering) return;
      isDeepSpaceEntering = true;
      isReturningFromDeepSpace = true;
      deepSpaceStartTime = performance.now();
      deepSpaceStartPosition.copy(camera.position);
      deepSpaceStartTarget.copy(cameraLookTarget);
      deepSpaceDestinationPosition.copy(deepSpaceReturnPosition);
      deepSpaceDestinationTarget.copy(deepSpaceReturnTarget);
      document.getElementById('next-page').classList.remove('show');
      document.getElementById('deep-space-entry').classList.remove('show');
    }

    function checkEnlighten() {
      if (filledStatus.every(Boolean) && !isFullyEnlightened) {
        isFullyEnlightened = true;
        completionPromptPending = true;
        autoTourActive = false;
        const tourButton = document.getElementById('btn-auto-tour');
        tourButton.classList.remove('active');
        tourButton.textContent = '自由查看';
        setTimeout(() => {
          eyeOpen.visible = true; eyeLine.visible = false;
          haloLight.intensity = 4.2;
          document.getElementById('ending').classList.add('show');
        }, 2600);
      }
    }

    document.getElementById('btn-enter-deep-space').onclick = enterDeepSpace;
    document.getElementById('deep-space-entry').onclick = enterDeepSpace;
    document.getElementById('btn-skip-interaction').onclick = skipInteraction;
    document.getElementById('skip-interaction-prompt').onclick = skipInteraction;
    document.getElementById('btn-stay-first-layer').onclick = () => {
      completionPromptPending = false;
      document.getElementById('ending').classList.remove('show');
      document.getElementById('deep-space-entry').classList.add('show');
      document.getElementById('btn-auto-tour').textContent = '自由查看';
    };
    document.getElementById('btn-return-layer').onclick = returnToPreviousLayer;
    window.addEventListener('wheel', (event) => {
      if (freeViewActive) {
        event.preventDefault();
        freeViewRadius = THREE.MathUtils.clamp(freeViewRadius + event.deltaY * 0.01, 3.5, 40);
        updateFreeViewCamera();
        return;
      }
      if (!isFullyEnlightened || deepSpaceEntered || completionPromptPending) return;
      event.preventDefault();
      if (event.deltaY > 0) {
        enterDeepSpace();
      }
    }, { passive: false });

    let pinchStartDistance = 0;
    let pinchStartRadius = 0;
    window.addEventListener('touchstart', (event) => {
      if ((!freeViewActive && (!isFullyEnlightened || completionPromptPending)) || event.touches.length !== 2) return;
      const dx = event.touches[0].clientX - event.touches[1].clientX;
      const dy = event.touches[0].clientY - event.touches[1].clientY;
      pinchStartDistance = Math.hypot(dx, dy);
      if (freeViewActive) pinchStartRadius = freeViewRadius;
    }, { passive: true });
    window.addEventListener('touchmove', (event) => {
      if (pinchStartDistance === 0 || event.touches.length !== 2) return;
      event.preventDefault();
      const dx = event.touches[0].clientX - event.touches[1].clientX;
      const dy = event.touches[0].clientY - event.touches[1].clientY;
      const distance = Math.hypot(dx, dy);
      if (freeViewActive) {
        freeViewRadius = THREE.MathUtils.clamp(
          pinchStartRadius * pinchStartDistance / distance,
          3.5,
          40
        );
        updateFreeViewCamera();
      } else if (isFullyEnlightened && !completionPromptPending && distance - pinchStartDistance > 24) {
        pinchStartDistance = 0;
        enterDeepSpace();
      }
    }, { passive: false });
    window.addEventListener('touchend', (event) => {
      if (event.touches.length < 2) {
        pinchStartDistance = 0;
        pinchStartRadius = 0;
      }
    }, { passive: true });

    /* ==========================================================
       11. 交互事件：点击时不旋转，只有拖动时旋转
       ========================================================== */
    const getX = (e) => e.touches ? e.touches[0].clientX : e.clientX;
    const getY = (e) => e.touches ? e.touches[0].clientY : e.clientY;
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    container.addEventListener('pointerdown', (e) => {
      initAudio();
      isDragging = true; isSnapping = false; dragMoved = 0;
      dragStartX = getX(e); dragStartY = getY(e); dragStartRotY = ringGroup.rotation.y;
      lastDragX = dragStartX; lastDragTime = performance.now();
      rotVelocity = 0;
      if (freeViewActive) {
        freeViewDragStartX = getX(e);
        freeViewDragStartY = getY(e);
        freeViewDragStartTheta = freeViewTheta;
        freeViewDragStartPhi = freeViewPhi;
      }
      if (container.setPointerCapture) container.setPointerCapture(e.pointerId);
    });

    window.addEventListener('pointermove', (e) => {
      const cx = getX(e); const cy = getY(e);
      if (!isMobile && !freeViewActive) {
        const cursor = document.getElementById('tear-cursor');
        cursor.style.display = 'block';
        cursor.style.left = cx + 'px'; cursor.style.top = cy + 'px';

        // 空间移动限制，始终牢固看到观音主体
        const rawX = ((cx / window.innerWidth) - 0.5) * 1.5;
        const rawY = ((cy / window.innerHeight) - 0.5) * -0.9;
        targetCamParallaxX = Math.max(-1.1, Math.min(1.1, rawX));
        targetCamParallaxY = Math.max(-0.5, Math.min(0.6, rawY));
      }

      if (!isDragging) return;
      const dx = cx - dragStartX;
      dragMoved = Math.max(dragMoved, Math.abs(dx), Math.abs(cy - dragStartY));
      if (freeViewActive && !(e.pointerType === 'touch' && pinchStartDistance > 0)) {
        freeViewTheta = freeViewDragStartTheta - (cx - freeViewDragStartX) * 0.006;
        freeViewPhi = THREE.MathUtils.clamp(
          freeViewDragStartPhi + (cy - freeViewDragStartY) * 0.006,
          0.12,
          Math.PI - 0.12
        );
        updateFreeViewCamera();
        return;
      }
      if (freeViewActive) return;
      ringGroup.rotation.y = dragStartRotY + dx * 0.007;

      const now = performance.now();
      const dt = now - lastDragTime;
      if (dt > 4) {
        rotVelocity = ((cx - lastDragX) * 0.007) / dt * 16;
      }
      lastDragX = cx; lastDragTime = now;
    });

    window.addEventListener('pointerup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      if (freeViewActive && dragMoved >= 6) return;

      if (isFullyEnlightened) {
        if (dragMoved < 6) {
          const rect = container.getBoundingClientRect();
          mouse.x = ((getX(e) - rect.left) / rect.width) * 2 - 1;
          mouse.y = -((getY(e) - rect.top) / rect.height) * 2 + 1;
          raycaster.setFromCamera(mouse, camera);
          const hits = raycaster.intersectObjects(devotees.map((d) => d.group), true);
          if (hits.length > 0) {
            for (let d = 0; d < devotees.length; d++) {
              if (devotees[d].group.getObjectById(hits[0].object.id)) {
                if (filledStatus[d]) {
                  setSlotActive(d);
                  showAngelCompletionText(d);
                }
                return;
              }
            }
          }
        } else {
          const closest = findClosestSlotIndex(ringGroup.rotation.y);
          setSlotActive(closest, true);
          showAngelCompletionText(closest);
        }
        return;
      }

      // 如果是点击 (未发生拖动)：点击时不旋转！仅触发注泪或选中
      if (dragMoved < 6) {
        const rect = container.getBoundingClientRect();
        mouse.x = ((getX(e) - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((getY(e) - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const hits = raycaster.intersectObjects(devotees.map(d => d.group), true);
        if (hits.length > 0) {
          for (let d = 0; d < devotees.length; d++) {
            if (devotees[d].group.getObjectById(hits[0].object.id)) {
              if (filledStatus[d]) {
                showAngelCompletionText(d);
                return;
              }
              document.getElementById('angel-completion-text').classList.remove('show');
              if (d !== getNextCupIndex()) return;
              setSlotActive(d, false);
              triggerDropTear();
              return;
            }
          }
        }
        return; // 点击未命中物体直接返回，不产生旋转
      }

      // 只有在真正发生拖动 (dragMoved >= 6) 后，释放时才依据惯性吸附正面
      if (Math.abs(rotVelocity) < 0.02) {
        const closest = findClosestSlotIndex(ringGroup.rotation.y);
        setSlotActive(closest, true);
      }
    });

    /* ==========================================================
       12. 底部席位导航
       ========================================================== */
    const slotBar = document.getElementById('slot-bar');
    function bindSlotButton(button, idx) {
      button.addEventListener('click', () => {
        if (!isFullyEnlightened) return;
        setSlotActive(idx, true);
        showAngelCompletionText(idx);
      });
    }
    const ssrSlotButtons = slotBar.querySelectorAll('[data-ssr-slot]');
    if (ssrSlotButtons.length === DEVOTEE_SLOTS.length) {
      ssrSlotButtons.forEach((button) => {
        bindSlotButton(button, Number(button.dataset.ssrSlot));
      });
    } else {
      slotBar.replaceChildren();
      DEVOTEE_SLOTS.forEach((s, idx) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.disabled = true;
        button.className = `slot-item ${idx === 0 ? 'active' : ''}`;
        button.id = `slot-btn-${idx}`;
        button.setAttribute('aria-label', `第 ${s.num} 席 ${s.title}`);
        const label = document.createElement('span');
        label.className = 'slot-text';
        label.textContent = s.title.replace(' ', '');
        button.appendChild(label);
        bindSlotButton(button, idx);
        slotBar.appendChild(button);
      });
    }

    function updateUI() {
      const slot = DEVOTEE_SLOTS[activeSlotIndex];
      const filledCount = filledStatus.filter(Boolean).length;
      document.getElementById('top-current-slot').textContent = slot
        ? `第 ${slot.num} 席 ${slot.title}`
        : '八席皆圆满';
      document.getElementById('top-progress').textContent = `甘露圆满 ${filledCount} / 8`;
      document.getElementById('btn-skip-interaction').hidden = isFullyEnlightened;
      document.getElementById('skip-interaction-prompt').hidden = isFullyEnlightened;

      DEVOTEE_SLOTS.forEach((_, i) => {
        const b = document.getElementById(`slot-btn-${i}`);
        b.disabled = !isFullyEnlightened;
        b.className = `slot-item ${isFullyEnlightened ? 'available' : ''} ${filledStatus[i] ? 'filled' : ''} ${i === activeSlotIndex ? 'active' : ''}`;
      });

    }

    function showAngelCompletionText(idx) {
      if (!filledStatus[idx]) return;
      const slot = DEVOTEE_SLOTS[idx];
      document.getElementById('angel-text-label').textContent = `第 ${slot.num} 席 · ${filledStatus[idx] ? '功德圆满' : '静心领悟'}`;
      document.getElementById('angel-text-title').textContent = slot.title;
      document.getElementById('angel-text-copy').textContent = slot.verse;
      const subcopy = document.getElementById('angel-text-subcopy');
      subcopy.textContent = slot.sub;
      subcopy.hidden = !slot.sub;
      document.getElementById('angel-text-copy').parentElement.classList.toggle('notice-copy', slot.title === '须知');
      const link = document.getElementById('angel-text-link');
      link.href = slot.href || '';
      link.classList.toggle('show', Boolean(slot.href));
      link.parentElement.classList.toggle('has-link', Boolean(slot.href));
      document.getElementById('angel-completion-text').classList.add('show');
    }

    document.getElementById('btn-auto-tour').onclick = () => setFreeViewActive(!freeViewActive);
    window.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && freeViewActive) {
        setFreeViewActive(false);
      }
    });

    document.getElementById('btn-audio').onclick = function() {
      if (isMuted) {
        isMuted = false;
        backgroundMusic.muted = false;
        startBackgroundMusic();
      } else if (backgroundMusic.paused) {
        startBackgroundMusic();
      } else {
        isMuted = true;
        backgroundMusic.muted = true;
      }
      this.textContent = isMuted ? '已静音' : '音效开';
    };

    applyWhiteLineArt(scene);

    /* ==========================================================
       13. 主渲染循环 (平滑转动、盛开永久保持)
       ========================================================== */
    const clock = new THREE.Clock();
    let smoothedMusicEnergy = 0;
    function animate() {
      const now = performance.now() / 1000;
      const delta = Math.min(clock.getDelta(), 0.05);

      // 相机平滑视差微动 (受限范围内，始终锁定观音)
      if (isDeepSpaceEntering) {
        const progress = Math.min((performance.now() - deepSpaceStartTime) / 3600, 1);
        const easedProgress = progress * progress * (3 - 2 * progress);
        camera.position.lerpVectors(deepSpaceStartPosition, deepSpaceDestinationPosition, easedProgress);
        cameraLookTarget.lerpVectors(deepSpaceStartTarget, deepSpaceDestinationTarget, easedProgress);
        if (progress === 1) {
          isDeepSpaceEntering = false;
          if (isReturningFromDeepSpace) {
            deepSpaceEntered = false;
            document.getElementById('deep-space-entry').classList.add('show');
          } else {
            deepSpaceEntered = true;
            document.getElementById('next-page').classList.add('show');
          }
        }
      } else if (!isMobile && !freeViewActive && (!isFullyEnlightened || !deepSpaceEntered)) {
        camera.position.x += (targetCamParallaxX - camera.position.x) * 0.04;
        camera.position.y += ((defaultCamY + targetCamParallaxY) - camera.position.y) * 0.03;
      }
      camera.lookAt(cameraLookTarget);

      // 星空与灯光呼吸
      starField.rotation.y += delta * 0.012;
      musicStars.rotation.y -= delta * 0.004;
      haloLight.intensity = (isFullyEnlightened ? 3.8 : 2.4) + Math.sin(now * 1.6) * 0.7;
      bgLight.intensity = 1.6 + Math.cos(now * 1.2) * 0.5;
      const angelPulse = (Math.sin(now * 1.8) + 1) * 0.5;
      angelLineArtMaterial.opacity = 0.68 + angelPulse * 0.27;
      angelGlowLineArtMaterial.opacity = 0.08 + angelPulse * 0.2;

      let musicEnergy = 0;
      if (musicAnalyser && musicFrequencyData) {
        musicAnalyser.getByteFrequencyData(musicFrequencyData);
        let energySquaredSum = 0;
        let peakEnergy = 0;
        const firstEnergyBin = 2;
        const energyBins = Math.min(128, musicFrequencyData.length);
        for (let bin = firstEnergyBin; bin < energyBins; bin++) {
          const binEnergy = musicFrequencyData[bin] / 255;
          energySquaredSum += binEnergy * binEnergy;
          peakEnergy = Math.max(peakEnergy, binEnergy);
        }
        const rmsEnergy = Math.sqrt(energySquaredSum / Math.max(1, energyBins - firstEnergyBin));
        musicEnergy = Math.min(1, (rmsEnergy * 0.72 + peakEnergy * 0.28) * 2.8);
      }
      smoothedMusicEnergy += (musicEnergy - smoothedMusicEnergy) * 0.16;
      musicEnergy = smoothedMusicEnergy;
      starField.material.uniforms.uTime.value = now;
      starField.material.uniforms.uEnergy.value = musicEnergy * 0.18;
      musicStars.material.uniforms.uTime.value = now;
      musicStars.material.uniforms.uEnergy.value = musicEnergy;
      const ringPositions = musicRing.geometry.attributes.position.array;
      for (let i = 0; i < musicRingSegments; i++) {
        const angle = (i / musicRingSegments) * Math.PI * 2;
        const frequencyBin = musicFrequencyData
          ? Math.min(Math.floor((i / musicRingSegments) * 126) + 2, musicFrequencyData.length - 1)
          : 2;
        const previousEnergy = musicFrequencyData
          ? musicFrequencyData[Math.max(2, frequencyBin - 1)] / 255
          : 0;
        const currentEnergy = musicFrequencyData ? musicFrequencyData[frequencyBin] / 255 : 0;
        const nextEnergy = musicFrequencyData
          ? musicFrequencyData[Math.min(frequencyBin + 1, musicFrequencyData.length - 1)] / 255
          : 0;
        const frequencyEnergy = Math.pow(
          previousEnergy * 0.2 + currentEnergy * 0.6 + nextEnergy * 0.2,
          0.85
        );
        smoothedRingEnergies[i] += (frequencyEnergy - smoothedRingEnergies[i]) * 0.2;
        const ringWave = smoothedRingEnergies[i];
        const radius = musicRingRadius + musicEnergy * 0.08 + ringWave * 0.95;
        ringPositions[i * 3] = Math.cos(angle) * radius;
        ringPositions[i * 3 + 1] = musicEnergy * 0.04 + ringWave * 0.38;
        ringPositions[i * 3 + 2] = Math.sin(angle) * radius;
      }
      musicRing.geometry.attributes.position.needsUpdate = true;
      musicRing.material.opacity = musicEnergy * 0.95;

      // 莲花律动与盛开动画：全满时达到最大绽放 1.35 并永久保持，不回缩！
      lotusGroup.rotation.y = now * 0.08;
      const filledCount = filledStatus.filter(Boolean).length;
      waterLevels.forEach((level, index) => {
        updateCupLineProgress(index, THREE.MathUtils.clamp(
          (level - initialWaterLevel) / (fullWaterLevel - initialWaterLevel),
          0,
          1
        ));
      });
      const bloomTarget = isFullyEnlightened ? 1.35 : (0.2 + (filledCount / 8) * 0.8);
      lotusPetals.forEach((p, idx) => {
        p.mesh.rotation.x = p.base + bloomTarget * p.bloom + Math.sin(now * 1.5 + idx * 0.4) * 0.03;
      });

      // 满杯后轮盘仍缓慢巡游，其他时候沿用拖动惯性与巡游控制。
      if (!isDragging && isFullyEnlightened && !deepSpaceEntered) {
        if (!manualSlotSelection) {
          ringGroup.rotation.y += delta * 0.025;
        } else if (isSnapping && targetSnapRotY !== null) {
          const diff = targetSnapRotY - ringGroup.rotation.y;
          ringGroup.rotation.y += diff * 0.08;
          if (Math.abs(diff) < 0.001) {
            ringGroup.rotation.y = targetSnapRotY;
            isSnapping = false;
          }
        }
      } else if (!isDragging && !isFullyEnlightened) {
        if (Math.abs(rotVelocity) > 0.0001) {
          ringGroup.rotation.y += rotVelocity;
          rotVelocity *= 0.94;
          if (Math.abs(rotVelocity) < 0.001) {
            rotVelocity = 0;
            const c = findClosestSlotIndex(ringGroup.rotation.y);
            setSlotActive(c, true);
          }
        } else if (autoTourActive) {
          // 自动巡游
          ringGroup.rotation.y += 0.003;
          const cur = findClosestSlotIndex(ringGroup.rotation.y);
          if (cur !== activeSlotIndex) setSlotActive(cur, false);
        } else if (isSnapping && targetSnapRotY !== null) {
          const cur = ringGroup.rotation.y;
          const diff = targetSnapRotY - cur;
          ringGroup.rotation.y += diff * 0.08;
          if (Math.abs(diff) < 0.001) {
            ringGroup.rotation.y = targetSnapRotY;
            isSnapping = false;
          }
        }
      }

      // 杯中甘露微波
      devotees.forEach((d, i) => {
        if (waterLevels[i] > 0.05) {
          d.water.scale.x = 0.5 * (1 + Math.sin(now * 4 + i) * 0.015);
          d.water.scale.z = 0.5 * (1 + Math.cos(now * 4 + i) * 0.015);
        }
        const isNextCup = i === activeSlotIndex && !filledStatus[i];
        d.promptHalo.visible = isNextCup;
        d.promptGlow.visible = isNextCup;
        if (isNextCup) {
          const pulse = (Math.sin(now * 3.2) + 1) * 0.5;
          d.promptHaloMaterial.opacity = 0.35 + pulse * 0.55;
          d.promptHalo.scale.setScalar(0.96 + pulse * 0.16);
          d.promptGlowMaterial.opacity = 0.1 + pulse * 0.12;
          d.promptGlow.scale.setScalar(0.96 + pulse * 0.14);
          d.promptRipples.forEach(({ mesh, material, phaseOffset }) => {
            const phase = (now * 0.65 + phaseOffset) % 1;
            mesh.visible = true;
            mesh.scale.setScalar(0.95 + phase * 0.95);
            material.opacity = (1 - phase) * 0.48;
          });
        } else {
          d.promptRipples.forEach(({ mesh }) => { mesh.visible = false; });
        }
      });

      // 泪水粒子飞渡
      for (let k = activeTears.length - 1; k >= 0; k--) {
        const tear = activeTears[k];
        const p = (now - tear.st) / tear.dur;
        if (p >= 1) {
          scene.remove(tear.mesh);
          if (tear.onArrive) tear.onArrive();
          activeTears.splice(k, 1);
          continue;
        }
        const easedProgress = p * p * (3 - 2 * p);
        tear.mesh.position.lerpVectors(tear.start, tear.end, easedProgress);
      }

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (!freeViewActive && !isDeepSpaceEntering && !deepSpaceEntered) updateCameraBase();
    });
  </script>
</body>
</html>
