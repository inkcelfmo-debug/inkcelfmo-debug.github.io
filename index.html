<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网页标题</title>
    <!-- 引入独立 CSS 样式文件 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 背景音频：已替换为本地 123.mp3 引用 -->
    <audio id="bgm-audio" src="123.mp3" loop preload="auto"></audio>

    <!-- 页面主要内容容器 -->
    <div class="container">
        <!-- 根据你的原本结构放置页面元素 -->
        <div id="clock-container">
            <!-- 时钟 / 倒计时 / 文本展示区域 -->
        </div>

        <!-- 播放器控制按钮区域 -->
        <div class="audio-controls">
            <button id="play-btn">播放 / 暂停</button>
        </div>
    </div>

    <!-- 引入独立 JS 脚本文件 -->
    <script src="script.js"></script>
</body>
</html>
