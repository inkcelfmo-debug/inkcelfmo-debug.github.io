    body {

      font-family: sans-serif;
      margin: 0;
      padding: 40px;
    }
    h1 {
      text-align: center;
      margin-bottom: 40px;
    }
    /* 网格布局核心 */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }
    /* 单个方格样式 */
    .grid-item {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 30px 20px;
      text-align: center;
      text-decoration: none;
      color: inherit;
      transition: all 0.3s ease;
    }
    .grid-item:hover {
      background: #334155;
      transform: translateY(-5px);
      border-color: #38bdf8;
      box-shadow: 0 10px 20px rgba(56, 189, 248, 0.1);
    }
    .grid-item h3 {
      margin: 0 0 10px 0;
      font-size: 18px;
    }
    .grid-item p {
      margin: 0;
      font-size: 14px;
      color: #94a3b8;
    }
  </style>
</head>
